version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: skribl-redis
    ports:
      - '6379:6379'
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skribl-server
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_ORIGIN: http://localhost:80
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skribl-client
    ports:
      - '80:80'
    environment:
      VITE_SERVER_URL: http://localhost:3001
    depends_on:
      - server
    restart: always